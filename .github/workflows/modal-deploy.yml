name: Deploy OpenMontage Modal app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modal-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Modal app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deployment dependencies
        run: python -m pip install "modal==1.6.4" "fastapi>=0.110"

      - name: Deploy Modal app
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Missing MODAL_TOKEN_ID or MODAL_TOKEN_SECRET repository secret."
            exit 1
          fi
          modal deploy docker/modal_ltx2/app.py
